[project]
name = "comunicalo_auth"
authors = [{ name = "Grupo Comunicalo - Desarrollo" }]
description = "Login de Comunicalo Learning con número de empleado y contraseña del ERP"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
